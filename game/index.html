<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEIL — The Meridian Archive</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07090f; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { width: 1280px; height: 720px; max-width: 100vw; max-height: 100vh; display: block; touch-action: none; background: #0a0d18; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="VEIL: a top-down stealth game. Guide Wren through the Meridian Archive, collect the relics, and reach the exit unseen."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
